<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Placenta Shield - WebAR Interactivo</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden; font-family: sans-serif;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;" renderer="antialias: true; alpha: true">
        
        <a-light type="ambient" color="#ffffff" intensity="0.6"></a-light>
        <a-light type="directional" color="#00E5FF" intensity="0.8" position="-1 2 1"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.5" position="1 1 -1"></a-light>

        <a-marker preset="hiro">
            
            <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear" position="0 0.5 0">
                
                <a-sphere radius="0.7" color="#00E5FF" opacity="0.3" material="transparent: true; roughness: 0.1; metalness: 0.2;"></a-sphere>
                
                <a-sphere radius="0.69" color="#001A3D" opacity="0.2" material="transparent: true; wireframe: true;"></a-sphere>
                
                <a-torus-knot radius="0.18" tube="0.05" p="2" q="3" color="#00E5FF" material="roughness: 0.3; metalness: 0.5;"></a-torus-knot>
                <a-sphere radius="0.10" color="#FF00FF" opacity="0.9" position="0.05 0.05 0" material="roughness: 0.2"></a-sphere>
                
                <a-entity position="0 0.7 0" rotation="0 0 0">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0" material="metalness: 0.3"></a-sphere>
                </a-entity>
                
                <a-entity position="0 -0.7 0" rotation="0 0 180">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0"></a-sphere>
                </a-entity>
                
                <a-entity position="0.7 0 0" rotation="0 0 -90">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0"></a-sphere>
                </a-entity>
                
                <a-entity position="-0.7 0 0" rotation="0 0 90">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0"></a-sphere>
                </a-entity>
                
                <a-entity position="0.5 0.5 0" rotation="0 0 -45">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0"></a-sphere>
                </a-entity>
                
                <a-entity position="-0.5 0.5 0" rotation="0 0 45">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0"></a-sphere>
                </a-entity>
                
                <a-entity position="0.5 -0.5 0" rotation="0 0 -135">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0"></a-sphere>
                </a-entity>
                
                <a-entity position="-0.5 -0.5 0" rotation="0 0 135">
                    <a-cylinder radius="0.015" height="0.15" color="#001A3D" position="0 0.075 0"></a-cylinder>
                    <a-sphere radius="0.06" color="#FF3D00" position="0 0.15 0"></a-sphere>
                </a-entity>

            </a-entity>
            
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
