<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Placenta Shield - AR Arquitectónico</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>
<body style="margin: 0px; overflow: hidden; font-family: sans-serif;">

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" renderer="antialias: true; alpha: true">
        
        <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
        <a-light type="directional" color="#00E5FF" intensity="0.8" position="-1 2 1"></a-light>
        <a-light type="directional" color="#ffffff" intensity="0.4" position="1 1 -1"></a-light>

        <a-marker preset="hiro">
            
            <a-entity position="0 0.8 0" rotation="-45 0 0">
                
                <a-entity position="-1.2 0.8 0">
                    <a-plane width="1.6" height="0.4" color="#001A3D" opacity="0.8" position="0 0 -0.01"></a-plane>
                    <a-text value="EFECTO ESPONJA\nReceptor VEGFR capta sFlt-1 (Rojo)" color="#00E5FF" scale="0.4 0.4 0.4" align="center"></a-text>
                    <a-cylinder radius="0.005" height="1" color="#00E5FF" position="0.6 -0.5 0" rotation="0 0 60"></a-cylinder>
                </a-entity>

                <a-entity position="-1.2 -0.8 0">
                    <a-plane width="1.4" height="0.3" color="#001A3D" opacity="0.8" position="0 0 -0.01"></a-plane>
                    <a-text value="MEMBRANA LNP\nTamano seguro: 150nm" color="#FFFFFF" scale="0.4 0.4 0.4" align="center"></a-text>
                    <a-cylinder radius="0.005" height="0.8" color="#FFFFFF" position="0.5 0.3 0" rotation="0 0 -50"></a-cylinder>
                </a-entity>

                <a-entity position="1.2 0 0">
                    <a-plane width="1.5" height="0.5" color="#001A3D" opacity="0.8" position="0 0 -0.01"></a-plane>
                    <a-text value="TIJERA MOLECULAR\nEnzima Cas13 (Cian)\nARN guia crRNA (Magenta)" color="#FF00FF" scale="0.4 0.4 0.4" align="center"></a-text>
                    <a-cylinder radius="0.005" height="1" color="#FF00FF" position="-0.7 0 0" rotation="0 0 -90"></a-cylinder>
                </a-entity>


                <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 12000; easing: linear">

                    <a-icosahedron radius="0.15" color="#00E5FF" opacity="0.8" wireframe="true"></a-icosahedron>
                    <a-torus-knot radius="0.12" tube="0.03" p="3" q="5" color="#00E5FF" material="roughness: 0.2;"></a-torus-knot>
                    
                    <a-torus radius="0.18" tube="0.015" arc="270" color="#FF00FF" rotation="45 45 0" animation="property: rotation; to: 405 405 360; loop: true; dur: 8000;"></a-torus>

                    <a-sphere radius="0.5" color="#00E5FF" opacity="0.25" material="transparent: true; depthWrite: false;"></a-sphere>
                    <a-sphere radius="0.49" color="#001A3D" opacity="0.15" wireframe="true"></a-sphere>


                    <a-entity position="0 0.5 0">
                        <a-cylinder radius="0.01" height="0.1" color="#001A3D" position="0 0.05 0"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="-0.02 0.13 0" rotation="0 0 35"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="0.02 0.13 0" rotation="0 0 -35"></a-cylinder>
                        <a-sphere radius="0.035" color="#FF3D00" position="0 0.16 0" material="metalness: 0.3"></a-sphere>
                    </a-entity>

                    <a-entity position="0.5 0 0" rotation="0 0 -90">
                        <a-cylinder radius="0.01" height="0.1" color="#001A3D" position="0 0.05 0"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="-0.02 0.13 0" rotation="0 0 35"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="0.02 0.13 0" rotation="0 0 -35"></a-cylinder>
                        <a-sphere radius="0.035" color="#FF3D00" position="0 0.16 0"></a-sphere>
                    </a-entity>

                    <a-entity position="-0.5 0 0" rotation="0 0 90">
                        <a-cylinder radius="0.01" height="0.1" color="#001A3D" position="0 0.05 0"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="-0.02 0.13 0" rotation="0 0 35"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="0.02 0.13 0" rotation="0 0 -35"></a-cylinder>
                        </a-entity>

                    <a-entity position="0 0 0.5" rotation="90 0 0">
                        <a-cylinder radius="0.01" height="0.1" color="#001A3D" position="0 0.05 0"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="-0.02 0.13 0" rotation="0 0 35"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="0.02 0.13 0" rotation="0 0 -35"></a-cylinder>
                        <a-sphere radius="0.035" color="#FF3D00" position="0 0.16 0"></a-sphere>
                    </a-entity>

                    <a-entity position="0 0 -0.5" rotation="-90 0 0">
                        <a-cylinder radius="0.01" height="0.1" color="#001A3D" position="0 0.05 0"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="-0.02 0.13 0" rotation="0 0 35"></a-cylinder>
                        <a-cylinder radius="0.01" height="0.08" color="#001A3D" position="0.02 0.13 0" rotation="0 0 -35"></a-cylinder>
                        <a-sphere radius="0.035" color="#FF3D00" position="0 0.16 0"></a-sphere>
                    </a-entity>

                </a-entity> </a-entity> </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
